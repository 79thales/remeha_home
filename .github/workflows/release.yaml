name: Release package
# Balíček vzniká pouze z publikovaného tagu a obsahuje jen soubory integrace.
# Manifest musí mít stejnou verzi jako tag, jinak se vydání nezabalí.
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python scripts/build_release.py --tag "$RELEASE_TAG" --output remeha_home.zip
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: gh release upload "$RELEASE_TAG" remeha_home.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
