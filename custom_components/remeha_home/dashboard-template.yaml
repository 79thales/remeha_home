# Generic public template: no household identifiers, room names or local control logic.
# Map symbolic entity roles in a private bindings file kept outside the repository.
# W is current power; kWh is the calendar-period change of import counters.
# Negative W are clamped for display only; missing/stale readings are unavailable.
# Shelly raw measurements and upstream diagnostics live in the Details subview.
# Lovelace JSON storage drops YAML comments but retains the Jinja comments in cards.
_documentation:
  purpose: Generic English Remeha heating overview with a linked Details subview.
  bindings: Symbolic entity roles only. Real entity IDs, room names, addresses and local automations belong in a
    private bindings file or private template.
  power: W; negative readings are displayed as zero, missing or older-than-180-second readings are unavailable.
  energy: kWh; changes in import counters during the current calendar week, month and year in the HA timezone.
  side_effects: Generation is offline; controls write only when used. No history, automations or other views are
    changed.
  customization: Use --template for a private main/detail composition and --insert-after for an optional existing
    view anchor.
views:
- title: Remeha Heating
  path: remeha-heating
  icon: mdi:heat-pump
  type: sections
  max_columns: 3
  show_icon_and_title: true
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Remeha Heating
      heading_style: title
      icon: mdi:heat-pump
      grid_options:
        columns: full
      badges:
      - type: button
        text: Details
        icon: mdi:chart-line
        tap_action:
          action: navigate
          navigation_path: '@@DASHBOARD_BASE@@/remeha-heating-details'
    - type: thermostat
      entity: '@@CLIMATE@@'
      name: Heating zone
      features:
      - type: climate-hvac-modes
        hvac_modes:
        - 'off'
        - heat
        - auto
      grid_options:
        columns: full
    - type: entities
      title: Status and schedule
      show_header_toggle: false
      entities:
      - entity: '@@CLIMATE_STATUS@@'
        name: Heating zone status
      - entity: '@@THERMAL@@'
        name: Heat pump operation
      - entity: '@@SCHEDULE_TEMP@@'
        name: Scheduled temperature
      - entity: '@@NEXT_TEMP@@'
        name: Next temperature
      - entity: '@@NEXT_TIME@@'
        name: Next schedule change
      - entity: '@@FIREPLACE@@'
        name: Fireplace mode
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Domestic hot water
      heading_style: title
      icon: mdi:water-boiler
      grid_options:
        columns: full
    - type: tile
      entity: '@@DHW@@'
      name: DHW operation
      grid_options:
        columns: full
      features:
      - type: water-heater-operation-modes
        operation_modes:
        - heat_pump
        - performance
        - eco
    - type: tile
      entity: '@@DHW_TEMP@@'
      name: Water temperature
      grid_options:
        columns: 6
    - type: tile
      entity: '@@DHW_MODE@@'
      name: DHW activity
      grid_options:
        columns: 6
    - type: entities
      title: DHW targets
      show_header_toggle: false
      entities:
      - entity: '@@COMFORT@@'
        name: Comfort temperature
      - entity: '@@ECO@@'
        name: Eco temperature
      grid_options:
        columns: full
    - type: tile
      entity: '@@BOOST@@'
      name: DHW boost
      grid_options:
        columns: full
      tap_action:
        action: toggle
    - type: entities
      title: DHW status and schedule
      show_header_toggle: false
      entities:
      - entity: '@@DHW_STATUS@@'
        name: Water heating status
      - entity: '@@DHW_NEXT@@'
        name: Next DHW schedule change
      grid_options:
        columns: full
    - type: markdown
      content: Boost starts from Schedule mode. Turning it off returns DHW to Schedule. The device confirms supported
        targets and timing.
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Electricity consumption
      heading_style: title
      icon: mdi:lightning-bolt
      grid_options:
        columns: full
    - type: markdown
      content: '{# Display only: inputs are watts reported within the last 180 seconds.

        Negative power is clamped to zero. Missing or stale readings remain unavailable.

        No services are called and the source measurements and history are unchanged. #}

        {% set a=''@@POWER_HP@@'' %}{% set b=''@@POWER_BACKUP@@'' %}

        {% set av=states(a) %}{% set bv=states(b) %}

        {% set af=is_number(av) and (as_timestamp(now())-as_timestamp(states[a].last_reported,0))<=180 %}

        {% set bf=is_number(bv) and (as_timestamp(now())-as_timestamp(states[b].last_reported,0))<=180 %}

        {% set ap=([av|float,0]|max) if af else none %}

        {% set bp=([bv|float,0]|max) if bf else none %}

        ## {{ ((ap+bp)|round(0)|int) ~ '' W'' if ap is not none and bp is not none else ''Unavailable'' }}

        **Current power · heat pump + electric backup**


        Heat pump: **{{ (ap|round(0)|int ~ '' W'') if ap is not none else ''Unavailable'' }}** · Backup: **{{ (bp|round(0)|int
        ~ '' W'') if bp is not none else ''Unavailable'' }}**


        _Negative power is displayed as 0 W. Energy below covers the current calendar week, month and year using
        import counters in kWh._'
      grid_options:
        columns: full
    - type: statistic
      entity: '@@ENERGY_HP@@'
      name: Heat pump · week
      stat_type: change
      period:
        calendar:
          period: week
      icon: mdi:lightning-bolt
      unit: kWh
      grid_options:
        columns: 6
    - type: statistic
      entity: '@@ENERGY_BACKUP@@'
      name: Electric backup · week
      stat_type: change
      period:
        calendar:
          period: week
      icon: mdi:lightning-bolt
      unit: kWh
      grid_options:
        columns: 6
    - type: statistic
      entity: '@@ENERGY_HP@@'
      name: Heat pump · month
      stat_type: change
      period:
        calendar:
          period: month
      icon: mdi:lightning-bolt
      unit: kWh
      grid_options:
        columns: 6
    - type: statistic
      entity: '@@ENERGY_BACKUP@@'
      name: Electric backup · month
      stat_type: change
      period:
        calendar:
          period: month
      icon: mdi:lightning-bolt
      unit: kWh
      grid_options:
        columns: 6
    - type: statistic
      entity: '@@ENERGY_HP@@'
      name: Heat pump · year
      stat_type: change
      period:
        calendar:
          period: year
      icon: mdi:lightning-bolt
      unit: kWh
      grid_options:
        columns: 6
    - type: statistic
      entity: '@@ENERGY_BACKUP@@'
      name: Electric backup · year
      stat_type: change
      period:
        calendar:
          period: year
      icon: mdi:lightning-bolt
      unit: kWh
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: Heating curve and activities
      heading_style: title
      icon: mdi:chart-bell-curve-cumulative
      grid_options:
        columns: full
    - type: entities
      title: Heating curve
      show_header_toggle: false
      entities:
      - entity: '@@SLOPE@@'
        name: Curve slope
      - entity: '@@BASE@@'
        name: Curve base temperature (°C)
      grid_options:
        columns: full
    - type: entities
      title: Heating activity temperatures
      show_header_toggle: false
      entities:
      - entity: '@@ACTIVITY_1@@'
        name: Activity 1
      - entity: '@@ACTIVITY_2@@'
        name: Activity 2
      - entity: '@@ACTIVITY_3@@'
        name: Activity 3
      - entity: '@@ACTIVITY_4@@'
        name: Activity 4
      - entity: '@@ACTIVITY_5@@'
        name: Activity 5
      grid_options:
        columns: full
    - type: markdown
      content: Control ranges come from the device. Using a control changes a Remeha parameter; opening or generating
        this dashboard only reads data.
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Temperatures and pressure
      heading_style: title
      icon: mdi:home-thermometer
      grid_options:
        columns: full
    - type: tile
      entity: '@@ROOM@@'
      name: Room temperature
      grid_options:
        columns: 6
    - type: tile
      entity: '@@OUTDOOR@@'
      name: Outdoor temperature
      grid_options:
        columns: 6
    - type: tile
      entity: '@@PRESSURE@@'
      name: Water pressure
      grid_options:
        columns: full
    - type: history-graph
      title: Temperatures · last 24 hours
      hours_to_show: 24
      entities:
      - entity: '@@ROOM@@'
        name: Room
      - entity: '@@OUTDOOR@@'
        name: Outdoor
      - entity: '@@DHW_TEMP@@'
        name: DHW
      grid_options:
        columns: full
- title: Remeha Heating — Details
  path: remeha-heating-details
  icon: mdi:chart-line
  type: sections
  max_columns: 3
  subview: true
  back_path: '@@DASHBOARD_BASE@@/remeha-heating'
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Shelly measurements
      heading_style: title
      icon: mdi:meter-electric
      grid_options:
        columns: full
      badges:
      - type: button
        text: Back
        icon: mdi:arrow-left
        tap_action:
          action: navigate
          navigation_path: '@@DASHBOARD_BASE@@/remeha-heating'
    - type: entities
      title: Raw active power · W
      show_header_toggle: false
      entities:
      - entity: '@@POWER_HP@@'
        name: Heat pump
      - entity: '@@POWER_BACKUP@@'
        name: Electric backup
      grid_options:
        columns: full
    - type: entities
      title: Energy counters · kWh
      show_header_toggle: false
      entities:
      - entity: '@@ENERGY_HP@@'
        name: Heat pump · import
      - entity: '@@ENERGY_HP_RETURN@@'
        name: Heat pump · reverse direction
      - entity: '@@ENERGY_BACKUP@@'
        name: Electric backup · import
      - entity: '@@ENERGY_BACKUP_RETURN@@'
        name: Electric backup · reverse direction
      grid_options:
        columns: full
    - type: history-graph
      title: Raw power · last 24 hours
      hours_to_show: 24
      entities:
      - entity: '@@POWER_HP@@'
        name: Heat pump
      - entity: '@@POWER_BACKUP@@'
        name: Electric backup
      grid_options:
        columns: full
    - type: entities
      title: Meter diagnostics
      show_header_toggle: false
      entities:
      - entity: '@@METER_HP_TEMP@@'
        name: Heat pump meter temperature
      - entity: '@@METER_BACKUP_TEMP@@'
        name: Backup meter temperature
      grid_options:
        columns: full
    - type: markdown
      content: The main view clamps negative power to zero and excludes reverse-direction energy from consumption.
        These detail cards show original measurements, including their sign. Stored measurements and history are
        unchanged.
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Remeha energy sources
      heading_style: title
      icon: mdi:heat-pump-outline
      grid_options:
        columns: full
    - type: entities
      title: Heat pump · daily API data
      show_header_toggle: false
      entities:
      - entity: '@@PUMP_HEAT_IN@@'
        name: Heating · consumed energy
      - entity: '@@PUMP_WATER_IN@@'
        name: DHW · consumed energy
      - entity: '@@PUMP_COOL_IN@@'
        name: Cooling · consumed energy
      - entity: '@@PUMP_HEAT_OUT@@'
        name: Heating · delivered energy
      - entity: '@@PUMP_WATER_OUT@@'
        name: DHW · delivered energy
      - entity: '@@PUMP_COOL_OUT@@'
        name: Cooling · delivered energy
      - entity: '@@PUMP_EFFICIENCY@@'
        name: Seasonal efficiency, when reported
      grid_options:
        columns: full
    - type: entities
      title: Electric backup · daily API data
      show_header_toggle: false
      entities:
      - entity: '@@BACKUP_HEAT_IN@@'
        name: Heating · consumed energy
      - entity: '@@BACKUP_WATER_IN@@'
        name: DHW · consumed energy
      - entity: '@@BACKUP_COOL_IN@@'
        name: Cooling · consumed energy
      - entity: '@@BACKUP_HEAT_OUT@@'
        name: Heating · delivered energy
      - entity: '@@BACKUP_WATER_OUT@@'
        name: DHW · delivered energy
      - entity: '@@BACKUP_COOL_OUT@@'
        name: Cooling · delivered energy
      - entity: '@@BACKUP_EFFICIENCY@@'
        name: Seasonal efficiency, when reported
      grid_options:
        columns: full
    - type: markdown
      content: Remeha cloud data may be delayed or unavailable. Unknown values remain unknown. Calendar consumption
        in the main view uses the electricity import meters; cloud energy is not live electrical power.
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Integration maintenance
      heading_style: title
      icon: mdi:cog
      grid_options:
        columns: full
    - type: entities
      title: Integration
      show_header_toggle: false
      entities:
      - entity: '@@UPDATE@@'
        name: Remeha Home update
      grid_options:
        columns: full
    - type: entities
      title: Upstream commits
      show_header_toggle: false
      entities:
      - entity: '@@UPSTREAM_ORIGINAL@@'
        name: Original integration
      - entity: '@@UPSTREAM_COMMUNITY@@'
        name: Community fork
      - entity: '@@UPSTREAM_CHECK@@'
        name: Check upstream
      grid_options:
        columns: full
    - type: markdown
      content: '{# Read-only diagnostics: counts are confirmed by the public GitHub API.

        A failed or rate-limited check is unavailable, never assumed to be zero. #}

        {% for entity,label in [(''@@UPSTREAM_ORIGINAL@@'',''Original integration''),(''@@UPSTREAM_COMMUNITY@@'',''Community
        fork'')] %}

        **{{ label }}** · {% if is_number(states(entity)) %}{{ states(entity) }} new commits{% else %}Check unavailable
        ({{ state_attr(entity,''error'') or ''Waiting for data'' }}){% endif %}

        {% set stamp=state_attr(entity,''checked_at'') %}

        {% if stamp %}Checked: {{ as_timestamp(stamp) | timestamp_custom(''%Y-%m-%d %H:%M'', true) }}{% endif %}

        {% if state_attr(entity,''compare_url'') %}[Compare on GitHub]({{ state_attr(entity,''compare_url'') }}){%
        endif %}


        {% endfor %}

        Checks run every 12 hours. The manual button shares a five-minute cache and respects GitHub rate limits.
        Counts are relative to the upstream commits incorporated into this release; review changes before adopting
        them.'
      grid_options:
        columns: full
    - type: markdown
      content: The generator updates this detail subview together with the main view. Keep real entity mappings
        and any household-specific extensions in private files outside the repository.
      grid_options:
        columns: full
